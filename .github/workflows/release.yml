# Builds Chordinal for macOS, Windows and Linux when a v* tag is pushed, and attaches the builds to one draft release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # GeneralUser GS, which comes with the app: downloaded once and kept in the cache, not once per build, so the
  # releases don't load its host each time
  soundfonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: soundfonts/GeneralUser-GS
          key: soundfonts-generaluser-${{ hashFiles('tools/fetch-soundfonts.sh') }}
      - run: bash tools/fetch-soundfonts.sh generaluser
      - uses: actions/upload-artifact@v4
        with:
          name: soundfonts
          path: soundfonts/GeneralUser-GS
          retention-days: 1
  build:
    needs: soundfonts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    # a full build takes about 5 minutes; a hang should fail long before GitHub's 6-hour default
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24 blocks the user namespaces Chrome's sandbox needs, so Electron started without Playwright aborts
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron downloads its binary on first use; fetch it once here, or the tests that start it in parallel race to download it
      - run: node -e "require('electron')"
        working-directory: apps/desktop
      - run: node tools/build.mjs
      # these take about 2 minutes; if one hangs (an app left running), stop it here
      - if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a node --test 'test/**/*.test.js'
      - if: runner.os != 'Linux'
        timeout-minutes: 10
        run: node --test 'test/**/*.test.js'
      - run: npx vitest run
      - uses: actions/download-artifact@v4
        with:
          name: soundfonts
          path: soundfonts/GeneralUser-GS
      # the Flatpak is built on the freedesktop runtime and Electron base app, installed from Flathub
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npx electron-builder ${{ matrix.platform }} --config electron-builder.json --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.flatpak
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*/*
