# Runs what a commit must pass (formatting, lint, types, the build and the tests) on every push and pull request.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npx tsc -b
      - run: node tools/build.mjs
      # the Electron tests run hidden, but Electron on Linux still needs a display
      - run: xvfb-run -a node --test 'test/**/*.test.js'
      - run: npx vitest run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c e2e/playwright.config.ts
