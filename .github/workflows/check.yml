# Runs what a commit must pass (formatting, lint, types, the build and the tests) on every push and pull request.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24 blocks the user namespaces Chrome's sandbox needs, so Electron started without Playwright aborts
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron downloads its binary on first use; fetch it once here, or the tests that start it in parallel race to download it
      - run: node -e "require('electron')"
        working-directory: apps/desktop
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npx tsc -b
      - run: node tools/build.mjs
      # the Electron tests run hidden, but Electron on Linux still needs a display
      - run: xvfb-run -a node --test 'test/**/*.test.js'
        timeout-minutes: 10
      - run: npx vitest run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c e2e/playwright.config.ts
      # what a failed e2e test saw (page snapshot, screenshot), to read without running it again
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .e2e-results
          retention-days: 7
          include-hidden-files: true
